name: Public read-only smoke

on:
  pull_request:
    paths:
      - ".github/workflows/public-read-smoke.yml"
      - "apps/web/tests/smoke/public-read-only.mjs"
      - "docs/security/public-traffic-diagnostic-2026-11-02.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: Public endpoints (5 GETs only)
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Verify public endpoints
        run: node apps/web/tests/smoke/public-read-only.mjs
